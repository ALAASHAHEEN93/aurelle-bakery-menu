<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AURELLE Bakery Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Libre+Caslon+Text:wght@400&family=Pinyon+Script&display=swap">
<style>
/* Layout: a single open menu book lying on a marble table; one dessert per page, 3D page turn, dish "bakes in" from swirling flour. Deliberately single-theme (warm daylight). */
:root{
  --marble:#E6D6C4; --marble-deep:#CDB8A2; --paper:#F3EADB; --paper-edge:#E9DDCA;
  --ink:#3A2A22; --ink-soft:#6B574A; --gold:#B99560; --leather:#4A2618;
  --serif:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  --display:"Cormorant Garamond", Garamond, Georgia, serif;
  --script:"Pinyon Script", "Snell Roundhand", cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--marble);color:var(--ink);font-family:var(--serif);overflow-x:hidden}
.table{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-inline:16px;padding-block:28px;position:relative;isolation:isolate}
.table::before{content:"";position:absolute;inset:0;z-index:-2;
  background:
   radial-gradient(120% 80% at 70% 10%, rgba(255,248,238,.75), transparent 60%),
   radial-gradient(90% 70% at 10% 100%, rgba(150,115,85,.28), transparent 70%),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.004 .011' numOctaves='5' seed='7'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .44  0 0 0 0 .34  0 0 0 -2.3 1.25'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") center/900px,
   linear-gradient(160deg,#EADCCB,#D9C5B0 60%,#CDB59E)}
/* window light falling across the table */
.table::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(115deg,transparent 0 38%,rgba(255,250,240,.35) 46%,transparent 60%)}

.stage{perspective:2200px;width:min(84vw,430px)}
.book{position:relative;aspect-ratio:3/4.1;transform:rotateX(14deg) rotateZ(-2deg);transform-style:preserve-3d}
.cover{position:absolute;inset:-2.2% -4% -2.6% -11%;background:linear-gradient(180deg,#5A3020,var(--leather));border-radius:4px 10px 10px 4px;box-shadow:0 30px 50px -18px rgba(60,35,20,.55),0 8px 16px rgba(60,35,20,.25)}
.cover .corner{position:absolute;width:12%;aspect-ratio:1;right:-1px}
.cover .corner.tr{top:-1px}
.cover .corner.br{bottom:-1px;transform:scaleY(-1)}
.leftpage{position:absolute;top:0;bottom:0;left:-9%;width:9%;background:linear-gradient(90deg,#E3D5C0,var(--paper) 70%,#D9CAB3);border-radius:3px 0 0 3px;box-shadow:inset -10px 0 14px -10px rgba(80,55,35,.4)}
.leftpage::after{content:"";position:absolute;inset:6% 18% 6% 30%;border:1px solid rgba(185,149,96,.6);border-right:0}

.page{position:absolute;inset:0;background:
   radial-gradient(130% 90% at 80% 0%,#FBF5EA,transparent 60%),
   url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .42 0 0 0 0 .32 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"),
   var(--paper);
  border-radius:0 3px 3px 0;box-shadow:inset 14px 0 18px -14px rgba(80,55,35,.35);overflow:hidden;container-type:inline-size}
.frame{position:absolute;inset:4.5% 6%;border:1px solid var(--gold);pointer-events:none}
.frame::before{content:"";position:absolute;inset:5px;border:1px solid rgba(185,149,96,.55)}
.frame svg{position:absolute;width:9%;height:auto;color:var(--gold)}
.frame .a{top:-6px;left:-6px}.frame .b{top:-6px;right:-6px;transform:scaleX(-1)}
.frame .c{bottom:-6px;left:-6px;transform:scaleY(-1)}.frame .d{bottom:-6px;right:-6px;transform:scale(-1,-1)}

.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12cqw 10cqw 11cqw;text-align:center}
.brand{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
.brand .name{font-family:var(--display);font-weight:600;font-size:10.5cqw;letter-spacing:.06em;line-height:1;color:var(--ink)}
.brand .script{font-family:var(--script);font-size:6.4cqw;color:var(--ink-soft);margin-top:-2.6cqw;line-height:1}
.brand .rule{position:absolute;top:9.6cqw;left:4%;right:4%;height:1px;background:linear-gradient(90deg,transparent,rgba(110,85,65,.5) 12%,rgba(110,85,65,.5) 30%,transparent 31%,transparent 69%,rgba(110,85,65,.5) 70%,rgba(110,85,65,.5) 88%,transparent)}
.brand .tag{font-family:var(--serif);font-size:2.9cqw;color:var(--ink-soft);margin-top:1.2cqw;letter-spacing:.02em}
.dish{flex:1;width:100%;display:grid;place-items:center;position:relative;min-height:0}
.dish img{width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 2.5cqw 2.5cqw rgba(90,60,40,.18))}
.text{display:flex;flex-direction:column;align-items:center;gap:1.4cqw}
.text h2{margin:0;font-family:var(--serif);font-weight:400;font-size:6cqw;line-height:1.1;color:var(--ink);text-wrap:balance}
.text p{margin:0;font-family:var(--serif);font-size:3.3cqw;color:var(--ink-soft)}
.text .price{font-family:var(--serif);font-size:4.8cqw;color:var(--ink);margin-top:1cqw;font-variant-numeric:lining-nums}
canvas.dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* baking-in states */
.page.raw .dish img{opacity:0;transform:scale(.72) rotate(-8deg);filter:blur(14px)}
.page.raw .text>*{opacity:0;transform:translateY(8px)}
.page.baking .dish img{transition:opacity 1s ease .35s,transform 1.25s cubic-bezier(.2,.9,.25,1) .3s,filter 1.1s ease .45s}
.page.baking .text>*{transition:opacity .6s ease,transform .6s ease}
.page.baking .text>:nth-child(1){transition-delay:1s}.page.baking .text>:nth-child(2){transition-delay:1.15s}.page.baking .text>:nth-child(3){transition-delay:1.3s}

/* turning leaf */
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;z-index:3}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .back{transform:rotateY(180deg);background:linear-gradient(90deg,#E8DCC8,var(--paper));box-shadow:inset -20px 0 30px -20px rgba(80,55,35,.35)}
.leaf .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(60,40,25,0),rgba(60,40,25,.28));opacity:0;pointer-events:none}
.leaf.turn-out{animation:out .95s cubic-bezier(.45,.05,.3,1) forwards}
.leaf.turn-in{animation:in .95s cubic-bezier(.45,.05,.3,1) forwards}
.leaf.turn-out .shade{animation:sh .95s ease forwards}
.leaf.turn-in .shade{animation:sh .95s ease reverse forwards}
@keyframes out{0%{transform:rotateY(0) skewY(0)}45%{transform:rotateY(-80deg) skewY(-3deg)}100%{transform:rotateY(-172deg) skewY(0)}}
@keyframes in{0%{transform:rotateY(-172deg)}55%{transform:rotateY(-95deg) skewY(-3deg)}100%{transform:rotateY(0)}}
@keyframes sh{0%{opacity:0}50%{opacity:1}100%{opacity:.2}}

.hit{position:absolute;inset:0;z-index:4;cursor:pointer;background:transparent;border:0;padding:0}
.hit:focus-visible{outline:2px solid var(--gold);outline-offset:6px}

.controls{display:flex;align-items:center;gap:14px;font-family:var(--display);color:var(--ink)}
.controls button{font:inherit;color:inherit;background:rgba(255,250,242,.55);border:1px solid rgba(120,90,60,.25);backdrop-filter:blur(6px);border-radius:999px;height:40px;min-width:40px;padding:0 14px;display:grid;place-items:center;cursor:pointer;font-size:17px;font-weight:600}
.controls button:hover{background:rgba(255,250,242,.85)}
.controls button:focus-visible{outline:2px solid var(--leather);outline-offset:2px}
.dots{display:flex;gap:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(74,38,24,.25);transition:background .3s,transform .3s}
.dots i.on{background:var(--leather);transform:scale(1.25)}
.hint{margin:0;font-family:var(--display);font-style:italic;font-size:16px;color:var(--ink-soft);text-align:center}
@media (prefers-reduced-motion:reduce){.leaf.turn-out,.leaf.turn-in{animation-duration:.01s}.page.baking .dish img,.page.baking .text>*{transition-duration:.2s;transition-delay:0s}}
</style>

<style>[hidden]{display:none!important}</style>
</head>
<body>
<div class="table">
  <div class="stage">
    <div class="book" id="book">
      <div class="cover" aria-hidden="true">
        <svg class="corner tr" viewBox="0 0 40 40"><path d="M0 0H40V40L28 28V12H12Z" fill="#C9A66B"/><path d="M0 0H40V40L36 36V4H4Z" fill="#E2C48C"/></svg>
        <svg class="corner br" viewBox="0 0 40 40"><path d="M0 0H40V40L28 28V12H12Z" fill="#C9A66B"/><path d="M0 0H40V40L36 36V4H4Z" fill="#E2C48C"/></svg>
      </div>
      <div class="leftpage" aria-hidden="true"></div>
      <div class="page" id="base"></div>
      <div class="leaf" id="leaf" hidden><div class="face front page" id="leafFront"></div><div class="face back"></div><div class="shade"></div></div>
      <button class="hit" id="hit" aria-label="Turn to the next page"></button>
    </div>
  </div>
  <div class="controls">
    <button id="prev" aria-label="Previous page">‹</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button id="next" aria-label="Next page">›</button>
    <button id="play" aria-pressed="false">Play</button>
  </div>
  <p class="hint">Every page turn bakes a fresh order. Tap the page or swipe.</p>
</div>

<script>
const IMG={lava:"assets/desserts/lava.webp",cheese:"assets/desserts/cheese.webp",croissant:"assets/desserts/croissant.webp",hazel:"assets/desserts/hazel.webp",tart:"assets/desserts/tart.webp"};
const MENU=[
 {k:"lava",n:"Chocolate Lava Cake",d:"Warm chocolate, with a gooey center.",p:119,c:["#5A2E1C","#F4EBD8","#C2263A"]},
 {k:"cheese",n:"Strawberry Crunch Cheesecake",d:"Creamy, fruity, with a crunchy twist.",p:129,c:["#D8352F","#E7C58F","#F6EEDC"]},
 {k:"croissant",n:"Strawberry Croissant",d:"Flaky, buttery, with fresh strawberries.",p:119,c:["#C8813C","#D8352F","#2C3C6E"]},
 {k:"hazel",n:"Chocolate Hazelnut Cake",d:"Rich chocolate, with roasted hazelnuts.",p:139,c:["#4E2716","#C99A62","#7A4A2A"]},
 {k:"tart",n:"Pistachio Raspberry Tart",d:"Nutty, fresh, with a hint of sweetness.",p:129,c:["#A9B85C","#C8213F","#D8A35E"]}
];
const ORN=`<svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 29V10Q6 6 10 6H29"/><path d="M2 20Q2 2 20 2"/><circle cx="6" cy="6" r="2"/></svg>`;
const $=s=>document.getElementById(s);
const base=$("base"),leaf=$("leaf"),leafFront=$("leafFront");
let idx=0,busy=false,timer=null;

function pageHTML(i){const m=MENU[i];return `<div class="frame">${["a","b","c","d"].map(x=>ORN.replace("<svg",`<svg class="${x}"`)).join("")}</div>
 <div class="content"><div class="brand"><span class="rule"></span><span class="name">AURELLE</span><span class="script">Bakery</span><span class="tag">Baked with a Better Mood</span></div>
 <div class="dish"><img src="${IMG[m.k]}" alt="${m.n}"></div>
 <div class="text"><h2>${m.n}</h2><p>${m.d}</p><div class="price">$${m.p}</div></div></div><canvas class="dust"></canvas>`}

function dots(){$("dots").innerHTML=MENU.map((_,i)=>`<i class="${i===idx?"on":""}"></i>`).join("")}

function bake(page,i){
  page.classList.add("raw");page.classList.remove("baking");
  void page.offsetWidth;
  requestAnimationFrame(()=>{page.classList.add("baking");page.classList.remove("raw")});
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=page.querySelector("canvas"),r=page.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
  const W=page.clientWidth,H=page.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const cx=W/2,cy=H*.5,col=MENU[i].c,P=[];
  for(let j=0;j<320;j++){
    const kind=j<230?"flour":j<285?"spark":"crumb";
    P.push({kind,a:Math.random()*Math.PI*2,r:W*(.25+Math.random()*.55),sp:(1.6+Math.random()*2.4)*(Math.random()<.5?1:1),
      s:kind==="flour"?.6+Math.random()*2.2:kind==="spark"?.8+Math.random()*1.4:1.5+Math.random()*2.5,
      d:Math.random()*.35,c:col[j%col.length],ey:(Math.random()-.5)*H*.18,ex:(Math.random()-.5)*W*.35});
  }
  const T=1700,t0=performance.now();
  function f(now){
    const t=(now-t0)/T;ctx.clearRect(0,0,W,H);
    if(t>=1){ctx.clearRect(0,0,W,H);return}
    for(const p of P){
      let u=Math.min(1,Math.max(0,(t-p.d)/(1-p.d)));if(u<=0)continue;
      const e=1-Math.pow(1-u,3);
      const ang=p.a+e*p.sp*Math.PI;const rad=p.r*(1-e)+(p.kind==="crumb"?0:W*.06*Math.sin(u*Math.PI));
      const x=cx+Math.cos(ang)*rad+p.ex*e*.4,y=cy+Math.sin(ang)*rad*.55+p.ey*e;
      const al=Math.sin(u*Math.PI)*(p.kind==="flour"?.75:1);
      ctx.globalAlpha=al;
      if(p.kind==="flour"){ctx.fillStyle="#FFFDF8";ctx.beginPath();ctx.arc(x,y,p.s,0,7);ctx.fill()}
      else if(p.kind==="spark"){ctx.fillStyle="#FFF4D6";ctx.shadowColor="#FFE7A8";ctx.shadowBlur=6;ctx.fillRect(x-p.s/2,y-p.s/2,p.s,p.s);ctx.shadowBlur=0}
      else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(x,y,p.s*(1-e*.6),0,7);ctx.fill()}
    }
    ctx.globalAlpha=1;requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}

function go(dir){
  if(busy)return;busy=true;
  const from=idx,to=(idx+dir+MENU.length)%MENU.length;
  leaf.hidden=false;leaf.className="leaf";
  if(dir>0){
    leafFront.innerHTML=pageHTML(from);
    base.innerHTML=pageHTML(to);base.classList.add("raw");base.classList.remove("baking");
    void leaf.offsetWidth;leaf.classList.add("turn-out");
    setTimeout(()=>bake(base,to),480);
    leaf.addEventListener("animationend",()=>{leaf.hidden=true;busy=false},{once:true});
  }else{
    leafFront.innerHTML=pageHTML(to);leafFront.classList.add("raw");leafFront.classList.remove("baking");
    void leaf.offsetWidth;leaf.classList.add("turn-in");
    setTimeout(()=>bake(leafFront,to),420);
    leaf.addEventListener("animationend",()=>{
      setTimeout(()=>{base.innerHTML=pageHTML(to);base.className="page";leaf.hidden=true;leafFront.className="face front page";busy=false},1500);
    },{once:true});
  }
  idx=to;dots();
}
function setPlay(on){clearInterval(timer);timer=on?setInterval(()=>go(1),3200):null;$("play").textContent=on?"Pause":"Play";$("play").setAttribute("aria-pressed",on)}
$("next").onclick=()=>{go(1)};$("prev").onclick=()=>{go(-1)};
$("hit").onclick=()=>go(1);
$("play").onclick=()=>setPlay(!timer);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let sx=null;$("hit").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("hit").addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){e.preventDefault();go(dx<0?1:-1)}sx=null});

base.innerHTML=pageHTML(0);base.classList.add("raw");dots();
setTimeout(()=>bake(base,0),250);
setPlay(true);
</script>

</body>
</html>
